interface:
  display_name: "Job Search Assistant"
  short_description: "Find companies, compare jobs, and research workforce trends"
  default_prompt: "Use $job-search-assistant to search from my goals or resume and target 20 companies. Save a report with the included HTML template, showing recommended jobs first and expandable company details: linked names, match ratings, size, workforce trends, latest reported layoffs, and up to three recommended jobs each. Include a Markdown companion with company-first tables and reusable search keywords."
